<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wave Journal - 理性と感性の波</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0F0F1A" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0F0F1A; overflow-x: hidden; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "wave-journal-entries";

// localStorage を window.storage 互換の簡易インターフェースとして使う
const storage = {
  get: async (key) => {
    const value = localStorage.getItem(key);
    return { value };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
  },
};

const STATE_OPTIONS = [
  { value: -3, label: "理性の極", sub: "計画ばかり、手が動かない", color: "#3B82F6" },
  { value: -2, label: "理性寄り", sub: "やや構造化モード", color: "#60A5FA" },
  { value: -1, label: "理性よりの核", sub: "核にいる、少し構造的", color: "#A5B4FC" },
  { value: 1, label: "感性よりの核", sub: "核にいる、少し自由", color: "#E879F9" },
  { value: 2, label: "感性寄り", sub: "やや自由モード", color: "#F9A8D4" },
  { value: 3, label: "感性の極", sub: "些事に夢中、目的からそれる", color: "#FB7185" },
];

function getStateOption(value) {
  return STATE_OPTIONS.find((o) => o.value === value) || STATE_OPTIONS[2];
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

const POINT_SPACING = 44;

function WaveGraph({ entries, scrollable }) {
  const height = 120;
  const padding = { left: 32, right: 32, top: 20, bottom: 20 };
  const innerH = height - padding.top - padding.bottom;
  const containerRef = useRef(null);

  const width = scrollable
    ? Math.max(600, padding.left + padding.right + (entries.length - 1) * POINT_SPACING)
    : 600;
  const innerW = width - padding.left - padding.right;

  useEffect(() => {
    if (scrollable && containerRef.current) {
      containerRef.current.scrollLeft = containerRef.current.scrollWidth;
    }
  }, [scrollable, entries.length]);

  if (entries.length === 0) return null;

  const valueToIndex = { "-3": 0, "-2": 1, "-1": 2, "1": 3, "2": 4, "3": 5 };

  const points = entries.map((e, i) => {
    const x = scrollable
      ? padding.left + i * POINT_SPACING
      : padding.left + (entries.length === 1 ? innerW / 2 : (i / (entries.length - 1)) * innerW);
    const idx = valueToIndex[String(e.value)] ?? 2;
    const y = padding.top + (idx / 5) * innerH;
    return { x, y, entry: e };
  });

  const pathD = points.length === 1
    ? `M ${points[0].x} ${points[0].y}`
    : points.reduce((acc, p, i) => {
        if (i === 0) return `M ${p.x} ${p.y}`;
        const prev = points[i - 1];
        const cx = (prev.x + p.x) / 2;
        return acc + ` C ${cx} ${prev.y}, ${cx} ${p.y}, ${p.x} ${p.y}`;
      }, "");

  const centerY = padding.top + (2.5 / 5) * innerH;

  const svg = (
    <svg
      viewBox={`0 0 ${width} ${height}`}
      preserveAspectRatio={scrollable ? undefined : "none"}
      style={scrollable
        ? { width, height, display: "block", flexShrink: 0 }
        : { width: "100%", height: 120, display: "block" }}
    >
      <line
        x1={padding.left} y1={centerY}
        x2={width - padding.right} y2={centerY}
        stroke="#4B5563" strokeWidth="1" strokeDasharray="4 4"
      />
      <text x={8} y={padding.top + 6} fill="#60A5FA" fontSize="9" opacity="0.6">理性</text>
      <text x={8} y={height - padding.bottom + 2} fill="#FB7185" fontSize="9" opacity="0.6">感性</text>

      <path d={pathD} fill="none" stroke="url(#waveGrad)" strokeWidth="2" strokeLinecap="round" />

      <defs>
        <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#60A5FA" />
          <stop offset="50%" stopColor="#A78BFA" />
          <stop offset="100%" stopColor="#FB7185" />
        </linearGradient>
      </defs>

      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r={4} fill={getStateOption(p.entry.value).color} opacity="0.9" />
          <text x={p.x} y={height - 4} fill="#6B7280" fontSize="8" textAnchor="middle">
            {formatDate(p.entry.date)}
          </text>
        </g>
      ))}
    </svg>
  );

  if (!scrollable) return svg;

  return (
    <div ref={containerRef} style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
      {svg}
    </div>
  );
}

function App() {
  const [entries, setEntries] = useState([]);
  const [selected, setSelected] = useState(null);
  const [note, setNote] = useState("");
  const [saved, setSaved] = useState(false);
  const [view, setView] = useState("input");
  const [logRange, setLogRange] = useState("week");
  const [importMessage, setImportMessage] = useState("");
  const noteRef = useRef(null);
  const fileInputRef = useRef(null);

  const todayStr = new Date().toISOString().slice(0, 10);
  const [targetDate, setTargetDate] = useState(todayStr);
  const targetEntry = entries.find((e) => e.date === targetDate);

  useEffect(() => {
    setSelected(targetEntry ? targetEntry.value : null);
    setNote(targetEntry ? targetEntry.note || "" : "");
  }, [targetDate, entries]);

  useEffect(() => {
    const load = async () => {
      try {
        const result = await storage.get(STORAGE_KEY);
        if (result?.value) setEntries(JSON.parse(result.value));
      } catch (_) {}
    };
    load();
  }, []);

  const handleSave = async () => {
    if (selected === null) return;
    const newEntry = { date: targetDate, value: selected, note };
    const updated = [...entries.filter((e) => e.date !== targetDate), newEntry]
      .sort((a, b) => a.date.localeCompare(b.date));
    setEntries(updated);
    try {
      await storage.set(STORAGE_KEY, JSON.stringify(updated));
    } catch (_) {}
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `wave-journal-backup-${todayStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleImportFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      const imported = JSON.parse(text);
      if (!Array.isArray(imported)) throw new Error("not an array");
      const byDate = new Map(entries.map((en) => [en.date, en]));
      let count = 0;
      for (const en of imported) {
        if (en && en.date) { byDate.set(en.date, en); count++; }
      }
      const merged = [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date));
      setEntries(merged);
      await storage.set(STORAGE_KEY, JSON.stringify(merged));
      setImportMessage(`${count}件を読み込み、統合しました（合計${merged.length}件）`);
    } catch (_) {
      setImportMessage("読み込みに失敗した。正しいバックアップファイルか確認してください。");
    }
    setTimeout(() => setImportMessage(""), 5000);
  };

  const currentOption = selected !== null ? getStateOption(selected) : null;

  let visibleEntries = entries;
  if (logRange === "week" || logRange === "month") {
    const rangeDays = logRange === "week" ? 7 : 30;
    const rangeStart = new Date(todayStr);
    rangeStart.setDate(rangeStart.getDate() - (rangeDays - 1));
    const rangeStartStr = rangeStart.toISOString().slice(0, 10);
    visibleEntries = entries.filter((e) => e.date >= rangeStartStr && e.date <= todayStr);
  }

  return (
    <div style={{
      minHeight: "100vh",
      background: "linear-gradient(160deg, #0F0F1A 0%, #1A1025 50%, #0F1A1A 100%)",
      color: "#E2E8F0",
      fontFamily: "'Inter', sans-serif",
      padding: "0",
    }}>
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "32px 20px 80px" }}>

        <div style={{ marginBottom: 40 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.15em", color: "#6B7280", marginBottom: 6 }}>
            WAVE JOURNAL
          </div>
          <div style={{ fontSize: 26, fontWeight: 300, letterSpacing: "-0.02em", color: "#F1F5F9" }}>
            今日の波はどこにいる？
          </div>
        </div>

        <div style={{ display: "flex", gap: 4, marginBottom: 32, background: "#1E1E2E", borderRadius: 10, padding: 4 }}>
          {["input", "log"].map((v) => (
            <button
              key={v}
              onClick={() => setView(v)}
              style={{
                flex: 1, padding: "8px 0", borderRadius: 7, border: "none", cursor: "pointer",
                fontSize: 13, fontWeight: 500, transition: "all 0.2s",
                background: view === v ? "#2D2D44" : "transparent",
                color: view === v ? "#E2E8F0" : "#6B7280",
              }}
            >
              {v === "input" ? "記録する" : "波を見る"}
            </button>
          ))}
        </div>

        {view === "input" && (
          <div>
            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 11, color: "#6B7280", letterSpacing: "0.1em", marginBottom: 10 }}>
                記録する日
              </div>
              <input
                type="date"
                value={targetDate}
                max={todayStr}
                onChange={(e) => e.target.value && setTargetDate(e.target.value)}
                style={{
                  width: "100%", background: "#1A1A2E", border: "1.5px solid #2D2D44",
                  borderRadius: 10, padding: "12px 14px", color: "#E2E8F0",
                  fontSize: 14, outline: "none", boxSizing: "border-box",
                  fontFamily: "inherit", colorScheme: "dark",
                }}
              />
            </div>

            {targetEntry && !saved && (
              <div style={{
                background: "#1E1E2E", borderRadius: 12, padding: "12px 16px",
                marginBottom: 24, fontSize: 12, color: "#9CA3AF",
                borderLeft: `3px solid ${getStateOption(targetEntry.value).color}`
              }}>
                {targetDate === todayStr ? "今日" : formatDate(targetDate)}はもう記録済み（{getStateOption(targetEntry.value).label}）。上書きできる。
              </div>
            )}

            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, color: "#6B7280", letterSpacing: "0.1em", marginBottom: 14 }}>
                今日の状態
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {STATE_OPTIONS.map((opt) => {
                  const isSelected = selected === opt.value;
                  return (
                    <button
                      key={opt.value}
                      onClick={() => setSelected(opt.value)}
                      style={{
                        display: "flex", alignItems: "center", gap: 14,
                        padding: "14px 16px", borderRadius: 12, border: "none", cursor: "pointer",
                        background: isSelected ? `${opt.color}18` : "#1A1A2E",
                        outline: isSelected ? `1.5px solid ${opt.color}60` : "1.5px solid transparent",
                        transition: "all 0.15s", textAlign: "left",
                      }}
                    >
                      <div style={{
                        width: 10, height: 10, borderRadius: "50%",
                        background: isSelected ? opt.color : "#374151",
                        boxShadow: isSelected ? `0 0 8px ${opt.color}80` : "none",
                        transition: "all 0.15s", flexShrink: 0,
                      }} />
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 500, color: isSelected ? opt.color : "#9CA3AF" }}>
                          {opt.label}
                        </div>
                        <div style={{ fontSize: 11, color: "#4B5563", marginTop: 2 }}>
                          {opt.sub}
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, color: "#6B7280", letterSpacing: "0.1em", marginBottom: 10 }}>
                根拠となる事実（一行）
              </div>
              <textarea
                ref={noteRef}
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="今日一番時間を使った活動は？"
                rows={2}
                style={{
                  width: "100%", background: "#1A1A2E", border: "1.5px solid #2D2D44",
                  borderRadius: 10, padding: "12px 14px", color: "#E2E8F0",
                  fontSize: 14, resize: "none", outline: "none", boxSizing: "border-box",
                  fontFamily: "inherit", lineHeight: 1.6,
                  transition: "border-color 0.15s",
                }}
                onFocus={(e) => e.target.style.borderColor = currentOption?.color || "#A78BFA"}
                onBlur={(e) => e.target.style.borderColor = "#2D2D44"}
              />
            </div>

            <button
              onClick={handleSave}
              disabled={selected === null}
              style={{
                width: "100%", padding: "14px", borderRadius: 12, border: "none",
                cursor: selected === null ? "not-allowed" : "pointer",
                fontSize: 14, fontWeight: 600, letterSpacing: "0.05em",
                background: selected !== null
                  ? `linear-gradient(135deg, ${getStateOption(selected).color}CC, ${getStateOption(selected).color}88)`
                  : "#1E1E2E",
                color: selected !== null ? "#0F0F1A" : "#4B5563",
                transition: "all 0.2s",
                boxShadow: selected !== null ? `0 4px 20px ${getStateOption(selected).color}40` : "none",
              }}
            >
              {saved ? "✓ 記録した" : "記録する"}
            </button>
          </div>
        )}

        {view === "log" && (
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
              {[["week", "一週間"], ["month", "一か月"], ["all", "全期間"]].map(([key, label]) => (
                <button
                  key={key}
                  onClick={() => setLogRange(key)}
                  style={{
                    padding: "6px 14px", borderRadius: 8, border: "none", cursor: "pointer",
                    fontSize: 12, fontWeight: 500,
                    background: logRange === key ? "#2D2D44" : "#1A1A2E",
                    color: logRange === key ? "#E2E8F0" : "#6B7280",
                  }}
                >
                  {label}
                </button>
              ))}
            </div>

            {visibleEntries.length > 0 ? (
              <>
                <div style={{
                  background: "#1A1A2E", borderRadius: 14, padding: "20px 16px 12px",
                  marginBottom: 24, overflow: "hidden",
                }}>
                  <div style={{ fontSize: 11, color: "#6B7280", marginBottom: 12, letterSpacing: "0.1em" }}>
                    波の軌跡
                  </div>
                  <WaveGraph entries={visibleEntries} scrollable={logRange === "all"} />
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {[...visibleEntries].reverse().map((e, i) => {
                    const opt = getStateOption(e.value);
                    return (
                      <div key={i} style={{
                        background: "#1A1A2E", borderRadius: 10, padding: "12px 16px",
                        borderLeft: `3px solid ${opt.color}`,
                        display: "flex", gap: 14, alignItems: "flex-start",
                      }}>
                        <div style={{ fontSize: 11, color: "#6B7280", minWidth: 32, paddingTop: 2 }}>
                          {formatDate(e.date)}
                        </div>
                        <div>
                          <div style={{ fontSize: 13, color: opt.color, fontWeight: 500, marginBottom: 3 }}>
                            {opt.label}
                          </div>
                          <div style={{ fontSize: 12, color: "#6B7280", lineHeight: 1.5 }}>
                            {e.note || "—"}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            ) : (
              <div style={{
                textAlign: "center", padding: "60px 20px",
                color: "#4B5563", fontSize: 13,
              }}>
                {entries.length === 0
                  ? <>まだ記録がない。<br />「記録する」タブから始めよう。</>
                  : `この${logRange === "week" ? "一週間" : logRange === "month" ? "一か月" : "期間"}の記録はまだない。`}
              </div>
            )}

            <div style={{ marginTop: 32, paddingTop: 20, borderTop: "1px solid #2D2D44" }}>
              <div style={{ fontSize: 11, color: "#6B7280", letterSpacing: "0.1em", marginBottom: 10 }}>
                データのバックアップ（全{entries.length}件）
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={handleExport}
                  disabled={entries.length === 0}
                  style={{
                    flex: 1, padding: "10px", borderRadius: 10, border: "1.5px solid #2D2D44",
                    cursor: entries.length === 0 ? "not-allowed" : "pointer",
                    background: "#1A1A2E", color: entries.length === 0 ? "#4B5563" : "#9CA3AF",
                    fontSize: 12, fontWeight: 500,
                  }}
                >
                  書き出す
                </button>
                <button
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  style={{
                    flex: 1, padding: "10px", borderRadius: 10, border: "1.5px solid #2D2D44",
                    cursor: "pointer", background: "#1A1A2E", color: "#9CA3AF",
                    fontSize: 12, fontWeight: 500,
                  }}
                >
                  読み込む
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="application/json"
                  onChange={handleImportFile}
                  style={{ display: "none" }}
                />
              </div>
              {importMessage && (
                <div style={{ marginTop: 10, fontSize: 12, color: "#9CA3AF" }}>{importMessage}</div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
  (function () {
    const transformed = Babel.transform(
      document.getElementById("app-source").textContent,
      { presets: [["react", { runtime: "classic" }]] }
    ).code;
    new Function(transformed)();
  })();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
